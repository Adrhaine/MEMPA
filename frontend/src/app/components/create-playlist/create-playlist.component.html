<div class="container">
  <button (click)="goBack()">← Retour</button>
  <h1>🎵 Créer une playlist</h1>

  <div class="form">
    <label>Nom de la playlist</label>
    <input [(ngModel)]="playlist.name" placeholder="Nom de la playlist" />

    <label>Créateur</label>
    <input [(ngModel)]="playlist.creator" placeholder="Ton nom" />

    <label>Style de musique</label>
    <input [(ngModel)]="playlist.style" placeholder="Rock, Pop, Jazz..." />

    <h2>Ajouter des morceaux</h2>
    <div class="song-form">
      <input [(ngModel)]="newSong.title" placeholder="Titre du morceau" />
      <input [(ngModel)]="newSong.artist" placeholder="Artiste" />
      <button (click)="addSong()">+ Ajouter</button>
    </div>

    <ul>
      @for (song of playlist.songs; let i = $index; track song.title) {
        <li>{{ song.title }} — {{ song.artist }}
          <button (click)="removeSong(i)">✕</button>
        </li>
      }
    </ul>

    <button (click)="submit()">✅ Créer la playlist</button>
  </div>
</div>
