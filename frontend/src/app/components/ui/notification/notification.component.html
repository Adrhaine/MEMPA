@if (notification) {
  <div
    class="fixed top-20 right-4 z-[100] min-w-[320px] max-w-sm rounded-lg overflow-hidden shadow-2xl animate-slideIn"
    [class]="notification.type === 'success'
      ? 'bg-green-500/10 border border-green-500/30'
      : 'bg-red-500/10 border border-red-500/30'">

    <!-- Contenu -->
    <div class="flex items-center justify-between px-4 py-3 gap-3">
      <!-- Icône + message -->
      <div class="flex items-center gap-3">
        <span
          class="text-lg"
          [class]="notification.type === 'success' ? 'text-green-400' : 'text-red-400'">
          {{ notification.type === 'success' ? '✓' : '!' }}
        </span>
        <p
          class="text-sm font-medium"
          [class]="notification.type === 'success' ? 'text-green-400' : 'text-red-400'">
          {{ notification.message }}
        </p>
      </div>

      <!-- Bouton fermer -->
      <button
        (click)="onDismiss()"
        class="text-[#7a6050] hover:text-[#f5e6d3] transition-colors text-xs ml-2">
        ✕
      </button>
    </div>

    <!-- Barre de progression -->
    <div
      class="h-0.5 transition-all ease-linear"
      [style.transition-duration]="'3000ms'"
      [class]="notification.type === 'success' ? 'bg-green-400' : 'bg-red-400'"
      [style.width.%]="progress">
    </div>
  </div>
}
