<div class="page-animate min-h-screen bg-[#1a1410] flex items-center justify-center px-4">
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-12">
      <div class="w-16 h-16 bg-[#e8c46c] rounded-full flex items-center justify-center mx-auto mb-4">
        <span class="text-[#1a1410] font-bold text-2xl">M</span>
      </div>
      <h1 class="text-4xl font-bold mb-2" style="font-family: 'Playfair Display', serif">MEMPA</h1>
      <p class="text-[#a89078] text-sm tracking-wide">Connectez-vous pour continuer</p>
    </div>

    <!-- Formulaire -->
    <div class="bg-[#2a1f15] p-8 rounded-lg space-y-5">
      <div>
        <label class="text-sm font-semibold text-[#f5e6d3] block mb-2">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          placeholder="votre@email.com"
          class="w-full bg-[#1a1410] border border-[#3d2d1e] text-[#f5e6d3] placeholder-[#7a6050] px-4 py-3 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-[#e8c46c] transition-all"
        />
      </div>

      <div>
        <label class="text-sm font-semibold text-[#f5e6d3] block mb-2">Mot de passe</label>
        <input
          type="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          class="w-full bg-[#1a1410] border border-[#3d2d1e] text-[#f5e6d3] placeholder-[#7a6050] px-4 py-3 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-[#e8c46c] transition-all"
        />
      </div>

      <button
        (click)="onLogin()"
        class="w-full bg-[#e8c46c] text-[#1a1410] font-bold py-3.5 text-sm tracking-wide hover:bg-[#f0d080] hover:scale-105 transition-all duration-200 rounded-full mt-2">
        Se connecter
      </button>
    </div>

    <p class="text-center text-[#a89078] text-sm mt-6">
      Pas encore de compte ?
      <a routerLink="/register" class="text-[#e8c46c] hover:text-[#f0d080] underline ml-1">S'inscrire</a>
    </p>
  </div>
</div>
