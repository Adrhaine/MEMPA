<div class="page-animate min-h-screen bg-mempa-black flex items-center justify-center px-4">
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-12">
      <div class="w-16 h-16 bg-mempa-orange rounded-full flex items-center justify-center mx-auto mb-4">
        <span class="text-mempa-black font-bold text-2xl">M</span>
      </div>
      <h1 class="text-4xl font-bold mb-2 font-serif">MEMPA</h1>
      <p class="text-mempa-cream-dim text-sm tracking-wide">Connectez-vous pour continuer</p>
    </div>

    <!-- Formulaire -->
    <div class="bg-mempa-dark p-8 rounded-lg space-y-5">
      <div>
        <label class="text-sm font-semibold text-mempa-cream block mb-2">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          placeholder="votre@email.com"
          class="w-full bg-mempa-black border border-mempa-darker text-mempa-cream placeholder-mempa-cream-dimmer px-4 py-3 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-mempa-orange transition-all"
        />
      </div>

      <div>
        <label class="text-sm font-semibold text-mempa-cream block mb-2">Mot de passe</label>
        <input
          type="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          class="w-full bg-mempa-black border border-mempa-darker text-mempa-cream placeholder-mempa-cream-dimmer px-4 py-3 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-mempa-orange transition-all"
        />
      </div>

      <button
        (click)="onLogin()"
        class="w-full bg-mempa-orange text-mempa-black font-bold py-3.5 text-sm tracking-wide hover:bg-[#f0d080] hover:scale-105 transition-all duration-200 rounded-full mt-2">
        Se connecter
      </button>
    </div>

    <p class="text-center text-mempa-cream-dim text-sm mt-6">
      Pas encore de compte ?
      <a routerLink="/register" class="text-mempa-orange hover:text-[#f0d080] underline ml-1">S'inscrire</a>
    </p>
    <p class="text-center text-mempa-cream-dim text-sm mt-6">
      <a routerLink="/" class="text-mempa-orange hover:text-[#f0d080]">Continuer en mode invité</a>
    </p>
  </div>
</div>
